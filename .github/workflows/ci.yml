name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: meetingai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/meetingai_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/meetingai_test
      SECRET_KEY: ci-secret-key-0123456789-0123456789-0123456789
      REDIS_URL: redis://localhost:6379/0
      GROQ_API_KEY: ci-dummy-key

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app tests alembic rag_eval

      - name: Migrations (monter, vérifier que les modèles correspondent, redescendre)
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base

      - name: Tests (pytest, PostgreSQL)
        run: pytest
